services:

  laravel-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-backend
    env_file:
      - .env.docker
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    ports:
      - "8000:8000"
    networks:
      - laravel
    command: >
      sh -c "composer install &&
             php artisan config:clear &&
             php artisan storage:link --force &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  vite:
    image: node:22
    container_name: laravel-vite
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - laravel-backend
    ports:
      - "5173:5173"
    networks:
      - laravel
    command: >
      sh -c "npm install && npm run dev"

  mysql:
    image: mysql:8.0
    container_name: mfidelhotel
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: fidelhotel
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel: